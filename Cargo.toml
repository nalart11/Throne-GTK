[workspace]
resolver = "2"
members = ["crates/ipc", "crates/config", "crates/store", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/nalart/throne-gtk"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
