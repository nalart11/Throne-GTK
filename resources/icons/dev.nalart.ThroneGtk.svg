<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Иконка повторяет главный элемент интерфейса: линию канала.
       Сталь — покой, янтарь — идущий трафик. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33475a"/>
      <stop offset="1" stop-color="#1b2530"/>
    </linearGradient>
    <linearGradient id="under" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8a33d" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#e8a33d" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#plate)"/>

  <!-- базовая линия канала -->
  <path d="M22 84 H106" stroke="#7f98ad" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- всплеск трафика -->
  <path d="M22 84 L38 84 C44 84 44 50 52 50 C60 50 58 78 66 78 C74 78 72 38 82 38 C92 38 90 84 106 84"
        fill="none" stroke="#e8a33d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M22 84 L38 84 C44 84 44 50 52 50 C60 50 58 78 66 78 C74 78 72 38 82 38 C92 38 90 84 106 84 Z"
        fill="url(#under)"/>
</svg>
